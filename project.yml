name: Speechless
options:
  bundleIdPrefix: com.joeblau
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: K78G42H4U2
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Speechless:
    type: application
    platform: macOS
    sources: [Speechless]
    info:
      path: Speechless/Info.plist
      properties:
        CFBundleDisplayName: Speechless
        LSApplicationCategoryType: public.app-category.developer-tools
        NSMotionUsageDescription: Speechless reads AirPods head-motion data to study whether mouthed words can be decoded into text.
        NSMicrophoneUsageDescription: Speechless records microphone audio alongside motion data and transcribes whispered speech for comparison.
        NSSpeechRecognitionUsageDescription: Speechless transcribes microphone audio on-device as a reference for the motion decoder.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.speechless
        CODE_SIGN_IDENTITY: Apple Development
        ENABLE_HARDENED_RUNTIME: NO
  SpeechlessTests:
    type: bundle.unit-test
    platform: macOS
    sources: [SpeechlessTests]
    dependencies:
      - target: Speechless
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joeblau.speechless.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Speechless:
    build:
      targets:
        Speechless: all
        SpeechlessTests: [test]
    test:
      targets: [SpeechlessTests]
